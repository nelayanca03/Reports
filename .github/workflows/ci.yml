name: CI & Firestore Security Rules Verification

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Java 21 (for Firestore Emulator)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run config sync, typecheck, ESLint, rules lint & unit tests
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Run Firestore Security Rules Emulator Suite
        run: npx firebase-tools emulators:exec --project demo-update-harian-outlet-rules --only firestore "npm run test -- tests/rules/firestoreRules.emulator.test.ts"
